name: Windows build and release assets
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Fetch checksum-pinned dependencies and public test fixtures
        run: ./scripts/bootstrap-dependencies.ps1
      - name: Build, test and create portable/source ZIPs with checksums
        run: ./scripts/package.ps1
      - name: Keep build and test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-diagnostics
          path: build/Testing/Temporary/*.log
          if-no-files-found: ignore
      - name: Store downloadable build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FileAnalysis-Windows-x64
          path: |
            dist/*-Windows-x64.zip
            dist/*-Source.zip
            dist/SHA256-*.txt
          if-no-files-found: error
